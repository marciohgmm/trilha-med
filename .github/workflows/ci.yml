# CI — validação em push e pull request (sem deploy).
name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze lib --no-fatal-infos

      - name: flutter test --coverage
        run: flutter test --coverage

      - name: Coverage summary
        run: python3 scripts/coverage_summary.py

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.md
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: flutter
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  functions:
    name: Cloud Functions (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm test
        run: npm test

  firestore:
    name: Firestore (rules + indexes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions deps (rules-unit-testing)
        working-directory: functions
        run: npm ci

      - name: Validate indexes + rules structure (unit tests)
        working-directory: functions
        run: npm test

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14.12.0

      - name: Compile Firestore rules (emulator)
        run: |
          firebase emulators:exec \
            --only firestore \
            --project revalida-cards \
            "echo Firestore rules compiled successfully"

      - name: Firebase deploy dry-run (rules + indexes)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::notice::FIREBASE_TOKEN não configurado — pulando dry-run remoto (emulator já validou rules)."
            exit 0
          fi
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --dry-run \
            --project revalida-cards \
            --non-interactive
